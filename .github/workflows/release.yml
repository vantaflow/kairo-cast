name: Release

# Publie Kairo Cast (TV), Kairo Cast Envoi (téléphone) et Kairo Cast pour Windows.
# Les APK sont signés avec la clé du projet, gardée en secret du dépôt : aucune machine n'a besoin de l'avoir.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de Kairo Cast, TV et Windows (ex. 1.3.0)"
        required: true
      envoi_version:
        description: "Version de Kairo Cast Envoi (vide = inchangée)"
        required: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      envoi: ${{ steps.commit.outputs.envoi }}
    env:
      VERSION: ${{ inputs.version }}
      ENVOI: ${{ inputs.envoi_version }}
    steps:
      - uses: actions/checkout@v7
      - id: commit
        run: |
          code() { IFS=. read -r a b c <<<"$1"; echo $((a * 10000 + b * 100 + c)); }
          ok() { [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $1"; exit 1; }; }
          ok "$VERSION"
          ! git ls-remote --exit-code --tags origin "v$VERSION" || { echo "La version $VERSION existe déjà"; exit 1; }
          sed -E -i "s/versionCode = [0-9]+/versionCode = $(code "$VERSION")/; s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          sed -E -i "s|<Version>[^<]+</Version>|<Version>$VERSION</Version>|" windows/KairoCast.App/KairoCast.App.csproj
          if [ -n "$ENVOI" ]; then
            ok "$ENVOI"
            sed -E -i "s/versionCode = [0-9]+/versionCode = $(code "$ENVOI")/; s/versionName = \"[^\"]+\"/versionName = \"$ENVOI\"/" sender/build.gradle.kts
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -qam "Version $VERSION"
          git push -q origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "envoi=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' sender/build.gradle.kts)" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      ENVOI: ${{ needs.version.outputs.envoi }}
      # Empreinte du certificat des versions publiées : une autre clé empêcherait la mise à jour.
      EXPECTED_CERT: 51ad39892b8f1eaaf2caf0d98e1948a2222a01c1d7387b8cf472cc82590451bb
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Installer le NDK et CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KAIRO_KEYSTORE_B64 }}
          KAIRO_SECRETS: ${{ secrets.KAIRO_SECRETS }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KAIRO_SECRETS" ] || { echo "Secrets KAIRO_KEYSTORE_B64 et KAIRO_SECRETS absents du dépôt"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kairo.jks"
          prop() { printf '%s\n' "$KAIRO_SECRETS" | tr -d '\r' | sed -n "s/^$1=//p" | head -1; }
          PASS="$(prop TVHOME_KEYSTORE_PASSWORD)"
          ALIAS="$(prop TVHOME_KEY_ALIAS)"
          {
            echo "storeFile=$RUNNER_TEMP/kairo.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=${ALIAS:-tvhome}"
            echo "keyPassword=$PASS"
          } > keystore.properties
      - name: Tests et APK
        run: ./gradlew testDebugUnitTest :app:assembleRelease :sender:assembleRelease
      - name: Vérifier la signature
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/kairo-cast-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk out/kairo-cast.apk
          cp sender/build/outputs/apk/release/sender-release.apk "out/kairo-cast-envoi-$ENVOI.apk"
          cp sender/build/outputs/apk/release/sender-release.apk out/kairo-cast-envoi.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in out/*.apk; do
            CERT=$("$SIGNER" verify --print-certs "$f" 2>&1 | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
            [ "$CERT" = "$EXPECTED_CERT" ] || { echo "$f : mauvaise clé ($CERT)"; exit 1; }
          done
          rm -f keystore.properties "$RUNNER_TEMP/kairo.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - name: Tests
        run: dotnet test windows/KairoCast.sln -c Release
      - name: Publier l'exécutable
        run: >
          dotnet publish windows/KairoCast.App -c Release -r win-x64
          -p:PublishSingleFile=true --self-contained true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - uses: actions/upload-artifact@v7
        with:
          name: exe
          path: out/KairoCast.exe
          if-no-files-found: error

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ inputs.version }}" dist/*.apk dist/KairoCast.exe
          --repo "$GITHUB_REPOSITORY" --target "${{ needs.version.outputs.sha }}"
          --title "Kairo Cast ${{ inputs.version }}" --generate-notes --latest
