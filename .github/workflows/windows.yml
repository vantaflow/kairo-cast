name: Windows

on:
  push:
  pull_request:

jobs:
  sender:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test KairoCast.Core.Tests
      - name: ffmpeg LGPL
        run: |
          ./scripts/fetch-ffmpeg.ps1
          $enc = ./vendor/ffmpeg.exe -hide_banner -encoders
          foreach ($e in 'h264_nvenc','h264_qsv','h264_amf','h264_mf') { if (-not ($enc -match $e)) { throw "encodeur absent : $e" } }
          if (-not ((./vendor/ffmpeg.exe -hide_banner -filters) -match 'ddagrab')) { throw 'ddagrab absent' }
      - name: Exe autonome
        run: |
          dotnet publish KairoCast/KairoCast.csproj -c Release -o out
          Copy-Item vendor/FFMPEG-LICENSE.txt out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: kairo-cast-windows
          path: |
            windows/out/KairoCast.exe
            windows/out/FFMPEG-LICENSE.txt
