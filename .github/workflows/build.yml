name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer le NDK et CMake (SDK déjà présent sur le runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Créer le keystore de debug
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Tests et APK release
        run: ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kairo-cast-release
          path: app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - name: Tests
        run: dotnet test windows/KairoCast.sln -c Release
      - name: Publier l'exécutable
        run: >
          dotnet publish windows/KairoCast.App -c Release -r win-x64
          -p:PublishSingleFile=true --self-contained true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Renommer l'exécutable
        shell: bash
        run: mv out/KairoCast.exe out/KairoCast-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: KairoCast-windows
          path: out/KairoCast-windows.exe
          if-no-files-found: error
